<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .gallery-item {
            width: 100%;
            height: 200px;
            background-color: aqua;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 50px;
            height: auto;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Demo</title>
</head>
<body>
    <div class="gallery">
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
        <div class="gallery-item"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>
    </div>
</body>
</html>
