<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute  Demo</title>
    <style>
        .box-parent {
            position: relative;
            width: 200px;
            height: 200px;
            left: 50px;
            background: yellow;
        }

        .box-child {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            top: 50px;
        }
    </style>
</head>
<body>
    <div class="box-parent">
        <div class="box-child"></div>
    </div>
</body>
</html>
