<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Demo</title>
    <style>
        body {
            height: 200vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sticky-box {
            position: sticky;
            display: flex;
            top: 50vh;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="sticky-box">Sticky Box</div>
    <p style="margin-top: 120 vh; text-align: center;">Scroll down</p>
</body>
</html>
