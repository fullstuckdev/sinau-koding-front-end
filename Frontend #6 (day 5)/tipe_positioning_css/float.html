<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .article {
            width: 80%;
            margin: 20px auto;
        }

        .article img {
            float: left;
            width: 300px;
            margin-right: 20px;
            margin-bottom: 10px;
        }

        .article p {
            text-align: justify
        }


        .clear {
            clear: both
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Demo</title>
</head>
<body>
    <div class="article">
        <div class="img"><img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt=""></div>

        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Optio inventore commodi amet cupiditate voluptatum rerum veniam delectus porro ea quas sit fugiat facere deleniti minus esse, quae, tempora aperiam. Voluptates!
        </p>
    </div>
</body>
</html>
