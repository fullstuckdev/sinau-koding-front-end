<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Box Example</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .box {
            border: 1px solid #000;
            padding: 10px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <p>Grid Item-1</p>
        </div>
        <div class="box">
            <p>Grid Item-2</p>
        </div>
        <div class="box">
            <p>Grid Item-3</p>
        </div>
        <div class="box">
            <p>Grid Item-4</p>
        </div>
        <div class="box">
            <p>Grid Item-5</p>
        </div>
        <div class="box">
            <p>Grid Item-6</p>
        </div>
        <div class="box">
            <p>Grid Item-7</p>
        </div>
        <div class="box">
            <p>Grid Item-8</p>
        </div>
        <div class="box">
            <p>Grid Item-9</p>
        </div>
        <div class="box">
            <p>Grid Item-10</p>
        </div>
        <div class="box">
            <p>Grid Item-11</p>
        </div>
        <div class="box">
            <p>Grid Item-12</p>
        </div>
    </div>
    </body>
    </html>
