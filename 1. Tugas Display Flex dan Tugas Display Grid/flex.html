<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Example</title>
    <style>
        .container {
            display: flex;
            gap: 12px; 
        }
        .box {
            border: 1px solid #000;
            padding: 10px;
            background-color: #f0f0f0;
            flex: 1; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="box">
                <p>Flex Item-1</p>
            </div>
            <div class="box">
                <p>Flex Item-2</p>
            </div>
            <div class="box">
                <p>Flex Item-3</p>
            </div>
            <div class="box">
                <p>Flex Item-4</p>
            </div>
            <div class="box">
                <p>Flex Item-5</p>
            </div>
            <div class="box">
                <p>Flex Item-6</p>
            </div>
            <div class="box">
                <p>Flex Item-7</p>
            </div>
            <div class="box">
                <p>Flex Item-8</p>
            </div>
    </div>
</body>
</html>
